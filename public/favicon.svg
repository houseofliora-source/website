<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="hlBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2823"/>
      <stop offset="100%" stop-color="#1B1815"/>
    </radialGradient>
    <linearGradient id="hlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C59B63"/>
      <stop offset="100%" stop-color="#8C5E35"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="64" cy="64" r="62" fill="url(#hlBg)" stroke="url(#hlGold)" stroke-width="3"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#C59B63" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.6"/>
  <!-- Leaf / Flame crest at top -->
  <path d="M64 22 C61 27 59 31 64 36 C69 31 67 27 64 22 Z" fill="url(#hlGold)"/>
  <!-- Monogram HL in royal serif style -->
  <text x="64" y="78" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="46" font-weight="600" fill="#FAF8F5" letter-spacing="2">HL</text>
  <!-- Small dot below -->
  <circle cx="64" cy="94" r="2.5" fill="url(#hlGold)"/>
</svg>